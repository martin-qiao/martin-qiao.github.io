<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!--
    DialWindLayer CSS mask-image convention:
    white = dial/wind video visible
    black = punched glass hole (VF layer shows through)
    Hole matches locked v26 VF_BOUNDS: px (524,301) 234×233 on the 1280×720 hero.
    While the wind plays, the hole follows vf-track.json (see useSyncedVfGlass).
  -->
  <rect width="1280" height="720" fill="white"/>
  <rect x="524" y="301" width="234" height="233" fill="black"/>
</svg>
